    <script>
let score = 85; 
let grade; 
output += "<h3>3. If-Else-If Statement</h3>"; 
if (score >= 90) { 
grade = "A"; 
} else if (score >= 75) { 
grade = "B"; 
} else if (score >= 50) { 
grade = "C"; 
} else { 
grade = "Fail"; 
} 
output += "Score: " + score + " - Grade: " + grade + "<br>"; 
</script>
