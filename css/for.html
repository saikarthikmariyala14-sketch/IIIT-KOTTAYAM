<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="ans"></p>
    <script>
        let i=1;
        let output="";
        for(let i=1;i<=5;i++){
            output=output+i+"<br>";
            i++;
        }
        document.getElementById("ans").innerHTML=output;
    </script>
</body>
</html>
