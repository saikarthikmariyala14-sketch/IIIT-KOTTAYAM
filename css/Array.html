<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="ans"></p>
    <script>
        let students = ["sai" ,"karthik","rahul","shreyas","tilak"];
        let output="";
        for(let i=0;i<students.length;i++){
            output=output+students[i]+"<br>";
        }
        document.getElementById("ans").innerHTML=output;
    </script>
</body>
</html>
