
<!DOCTYPE html>
<html>
<head>
    <title>Water Tank Monitoring</title>

    <style>
        h1 {
            color: darkblue;
        }

        .container {
            margin: 30px auto;
            padding: 20px;
        }

        input {
            padding: 10px;
            margin: 10px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background-color: rgb(233, 112, 12);
            color: rgb(255, 255, 255);
            border: none;
        }

        .tank {
            width: 180px;
            height: 300px;
            border: 5px solid black;
            border-radius: 10px;
           margin-top:40px;
            position: relative;
            overflow: hidden;
            background-color: white;
        }

        .water {
            width: 100%;
            height: 0%;
            position: absolute;
            bottom: 0;
            background-color: blue;
            transition: height 0.5s;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
        }

        #warning {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Water Tank Level Monitoring System</h1>

    <div class="container">

        <label>Total Tank Capacity (Litres):</label>
        <br>
        <input type="number" id="capacity" placeholder="Enter total capacity">

        <br>

        <label>Current Water Quantity (Litres):</label>
        <br>
        <input type="number" id="quantity" placeholder="Enter current quantity">

        <br>

        <button onclick="checkLevel()">Check Water Level</button>

        <div class="tank">
            <div class="water" id="water"></div>
        </div>

        <p id="result">Water Level: 0%</p>

        <p id="warning"></p>

    </div>

    <script>

        function checkLevel() {

            let capacity = Number(document.getElementById("capacity").value);
            let quantity = Number(document.getElementById("quantity").value);

            if (capacity <= 0 || quantity < 0 || quantity > capacity ||
                document.getElementById("capacity").value === "" ||
                document.getElementById("quantity").value === "") {

                alert("Please enter valid water quantities!");
                return;
            }

            let percentage = (quantity / capacity) * 100;

            let water = document.getElementById("water");

            water.style.height = percentage + "%";

            if (percentage > 60) {
                water.style.backgroundColor = "blue";
            }
            else if (percentage >= 30) {
                water.style.backgroundColor = "orange";
            }
            else {
                water.style.backgroundColor = "red";
            }

            document.getElementById("result").innerHTML =
                "Water Level: " + percentage.toFixed(2) + "%";

            if (percentage < 20) {
                document.getElementById("warning").innerHTML =
                    "WARNING! Water level is critically low!";
            }
            else {
                document.getElementById("warning").innerHTML = "";
            }

        }

    </script>

</body>
</html>
