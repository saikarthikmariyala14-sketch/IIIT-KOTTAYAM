<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #heading{
            position:sticky;
            background: linear-gradient(aqua,aquamarine,cadetblue);
        }
        #head{
            display:flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }
        #subs{
            text-transform: capitalize;
            text-shadow: 1px 1px black;
            font-weight: 900;
            font-family: Arial, Helvetica, sans-serif;
            font-variant: inherit;
             background-color:rgb(22, 234, 234);
        }
        body{
            background-color:rgb(80, 116, 116);
            border:10px solid black
        }
    </style>
</head>
<body>
    <div id="head">
    <div>
        <h1 id="heading">PERSONEL EXPENSE TRACKER</h1>
    </div>
    <div id="subs">
        <label id="amt">AMOUNT</label>
    <input for="amt" type="text">
    &nbsp;&nbsp; &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <label id="reason">CATEGORY:</label>
   <select>
    <option value="food">FOOD</option>
    <option value="travel"> TRAVEL</option>
    <option value="expense">EXPENSE</option>
    <option value="education">EDUCATION</option>
   </select>
    &nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <label id="des">DESCRIPTION</label>
    <input for="des" type="text">
    </div>
    </div>
</body>
</html>
